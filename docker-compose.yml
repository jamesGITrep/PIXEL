# Local plane: every service runs as if on its own VM.
#
#   users ──► frontend :3000 (only published port)
#                │  edge network
#                ▼
#             gateway (single API Gateway)
#                │  data network (private)
#        ┌───────┼──────────┬───────────┐
#      minio   worker ×N  assembler
#
# - Each service is configured only through environment variables (no shared volumes, no
#   co-location assumptions), mirroring the per-VM startup configuration in terraform/.
# - Network segmentation mirrors the GCP firewall: the frontend can reach only the gateway;
#   storage, workers and the assembler are unreachable from the frontend and from users.
# - Workers and the assembler accept no inbound traffic except their health check.

x-storage-env: &storage-env
  USE_GCP: "false"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  BUCKET_PHOTO_LIBRARY: bucket-photo-library
  BUCKET_TARGET_POSTERS: bucket-target-posters
  BUCKET_TASK_COORDINATION: bucket-task-coordination
  BUCKET_MOSAIC_OUTPUTS: bucket-mosaic-outputs

networks:
  edge:       # frontend <-> gateway
  data:       # gateway, workers, assembler <-> storage (no route from the frontend)
    internal: false

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: pixel_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # No published ports: storage is private. Inspect it with `docker compose exec minio mc ...`
    volumes:
      - minio_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: pixel_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks: [data]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bucket-photo-library &&
      mc mb --ignore-existing local/bucket-target-posters &&
      mc mb --ignore-existing local/bucket-task-coordination &&
      mc mb --ignore-existing local/bucket-mosaic-outputs &&
      mc anonymous set none local/bucket-photo-library &&
      mc anonymous set none local/bucket-mosaic-outputs &&
      echo '{\"Rules\":[{\"ID\":\"guest-vaults\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"personal/gst_\"},\"Expiration\":{\"Days\":1}},{\"ID\":\"guest-incoming\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"incoming/personal/gst_\"},\"Expiration\":{\"Days\":1}}]}' | mc ilm import local/bucket-photo-library &&
      echo 'MinIO buckets provisioned (private)'
      "

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: pixel_gateway
    environment:
      <<: *storage-env
      MAX_UPLOAD_MB: "30"
      # Local only: forgot-password returns the reset link (no mail service). Never set in GCP.
      AUTH_DEV_RETURN_RESET_LINK: "true"
      ADMIN_USERNAMES: "pm_admin"   # local test admin account (sign up as pm_admin)
    # Not published: reachable only from the frontend over the edge network
    networks: [edge, data]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *storage-env
      HEALTH_PORT: "8080"
    networks: [data]
    deploy:
      replicas: 3
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s   # matches the Spot VM preemption notice
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  assembler:
    build:
      context: .
      dockerfile: services/assembler/Dockerfile
    container_name: pixel_assembler
    environment:
      <<: *storage-env
      HEALTH_PORT: "8080"
    networks: [data]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    container_name: pixel_frontend
    environment:
      FRONTEND_PORT: "3000"
      API_GATEWAY_URL: http://gateway:8000
      MAX_UPLOAD_MB: "32"
    ports:
      - "3000:3000"   # the only port exposed to users
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:

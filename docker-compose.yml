services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: pixel_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: pixel_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/bucket-photo-library;
      mc mb --ignore-existing local/bucket-target-posters;
      mc mb --ignore-existing local/bucket-task-coordination;
      mc mb --ignore-existing local/bucket-mosaic-outputs;
      mc anonymous set download local/bucket-photo-library;
      mc anonymous set download local/bucket-mosaic-outputs;
      echo 'MinIO buckets successfully provisioned';
      exit 0;
      "

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: pixel_gateway
    ports:
      - "8000:8000"
    environment:
      - USE_GCP=false
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - BUCKET_PHOTO_LIBRARY=bucket-photo-library
      - BUCKET_TARGET_POSTERS=bucket-target-posters
      - BUCKET_TASK_COORDINATION=bucket-task-coordination
      - BUCKET_MOSAIC_OUTPUTS=bucket-mosaic-outputs
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      - USE_GCP=false
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - BUCKET_PHOTO_LIBRARY=bucket-photo-library
      - BUCKET_TARGET_POSTERS=bucket-target-posters
      - BUCKET_TASK_COORDINATION=bucket-task-coordination
      - BUCKET_MOSAIC_OUTPUTS=bucket-mosaic-outputs
    depends_on:
      minio-init:
        condition: service_completed_successfully

  assembler:
    build:
      context: .
      dockerfile: services/assembler/Dockerfile
    container_name: pixel_assembler
    environment:
      - USE_GCP=false
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - BUCKET_PHOTO_LIBRARY=bucket-photo-library
      - BUCKET_TARGET_POSTERS=bucket-target-posters
      - BUCKET_TASK_COORDINATION=bucket-task-coordination
      - BUCKET_MOSAIC_OUTPUTS=bucket-mosaic-outputs
    depends_on:
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: services/frontend
      dockerfile: Dockerfile
    container_name: pixel_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
      - NEXT_PUBLIC_STORAGE_URL=http://localhost:9000
    depends_on:
      - gateway

volumes:
  minio_data:
